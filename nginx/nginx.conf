# E:\BANK\PROJECT\SIGNLANG-APP\nginx\nginx.conf

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Server block สำหรับ HTTP (Port 80) - **ยังคงเดิม**
    server {
        listen 80;
        listen [::]:80;
        server_name 139-59-57-147.nip.io; # <<<<<<<<<<<<<<<< ตรวจสอบให้ตรงกับ IP ของคุณ

        # 1) เสิร์ฟ static assets ของ Vue จาก /root/SIGNLANG-APP/frontend/dist
        root /root/SIGNLANG-APP/frontend/dist;
        index index.html;
        
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # **ตอนนี้คุณต้องเปลี่ยนจาก 'return 301 https://$host$request_uri;'**
        # **เป็นเหมือนเดิมก่อน เพื่อให้ Vue.js ทำงานบน HTTP (ก่อน redirect)**
        # **แล้ว Certbot จะสร้าง rewrite rule ให้เองเมื่อรัน certbot --nginx**
        # **แต่เนื่องจากเราใช้ --webroot, เราจะใส่ return 301 ไปเลย**

        # ตรงนี้จะมีการตัดสินใจ:
        # 1. ให้ HTTP แสดงหน้า Vue ปกติ (จนกว่าจะเปิด HTTPS)
        # 2. ให้ HTTP redirect ไป HTTPS ทันที

        # ผมแนะนำให้เปลี่ยนกลับเป็น redirect เลย เพื่อให้บังคับใช้ HTTPS
        location / {
            return 301 https://$host$request_uri;
        }

        location /models/ {
            proxy_pass http://backend:3001/models/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /api/ {
            proxy_pass http://backend:3001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        # location /models/ {
        #     #alias /root/SIGNLANG-APP/models/;
        #     #alias /usr/share/nginx/html/models_data/;
        #     alias /app/models_data/;
        #     try_files $uri $uri/ =404;
        #     autoindex on;
        # }
    }

    # Server block สำหรับ HTTPS (Port 443) - **UNCOMMENT ส่วน SSL**
    # Server block สำหรับ HTTPS (Port 443)
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name 139-59-57-147.nip.io; # <<<<<<<<<<<<<<<< ตรวจสอบให้ตรงกับ IP ของคุณ

        # Path ไปยัง SSL Certificates ที่ Certbot สร้างให้
        ssl_certificate /etc/letsencrypt/live/139-59-57-147.nip.io/fullchain.pem; # <<<<<<<<<<<<<<<< UNCOMMENT
        ssl_certificate_key /etc/letsencrypt/live/139-59-57-147.nip.io/privkey.pem; # <<<<<<<<<<<<<<<< UNCOMMENT

        # Certbot ไม่ได้สร้างไฟล์นี้เมื่อใช้ --webroot ดังนั้น ให้คอมเมนต์ไว้
        # include /etc/letsencrypt/options-ssl-nginx.conf; # <<<<<<<<<<<<<<<< ต้องคอมเมนต์บรรทัดนี้

        # SSL Configuration พื้นฐาน (ที่จำเป็น)
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers 'EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH';

        ssl_dhparam /etc/nginx/dhparam.pem; # <<<<<<<<<<<<<<<< ต้อง UNCOMMENT

        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            proxy_pass http://backend:3001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # location /models/ {
        #     #alias /root/SIGNLANG-APP/models/;
        #     #alias /usr/share/nginx/html/models_data/;
        #     alias /app/models_data/;
        #     try_files $uri $uri/ =404;
        #     autoindex on;
        # }

        location /models/ {
            proxy_pass http://backend:3001/models/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}